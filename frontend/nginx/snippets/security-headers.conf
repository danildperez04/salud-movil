# Cabeceras de seguridad para el panel web. Se incluyen solo en las rutas de la
# SPA: las respuestas de /api/ ya traen las suyas desde Helmet, y duplicarlas
# generaría cabeceras repetidas.
#
# No se define Content-Security-Policy: el panel carga las fuentes desde Google
# Fonts. Si se quiere una CSP estricta, hay que autoalojar las fuentes primero.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
