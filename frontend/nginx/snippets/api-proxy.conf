# Cabeceras y timeouts comunes del reverse proxy hacia el API. Lo incluyen
# `/api/` y la subida de instaladores (que cambia límites, buffering y timeouts, por eso estos
# últimos no están aquí).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Se AÑADE la IP del cliente a la cadena existente. El API usa
# TRUST_PROXY=<nº de proxies> para tomar la IP correcta sin fiarse de lo
# que el cliente haya puesto al principio de la cabecera.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
